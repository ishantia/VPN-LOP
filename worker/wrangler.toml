name = "pricing-worker"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# Cloudflare KV binding for pricing lists
[[kv_namespaces]]
binding = "PRICING_KV"
id = "e24b2ff3d93f4b44a0122d430b7214b3"
preview_id = "46b635f59143411b916255c082451a35"

# Public environment variables
[vars]
DEFAULT_TITLE = "Special Plans"
DEFAULT_CURRENCY = "TOMAN"
CORS_ORIGIN = "*"

# Secret variables configured using `wrangler secret put <NAME>`:
# - TELEGRAM_BOT_TOKEN
# - TELEGRAM_WEBHOOK_SECRET
# - ADMIN_TELEGRAM_IDS (comma-separated list of numeric IDs, e.g. "12345678,98765432")
# - ADMIN_API_SECRET (random string for authenticating direct admin API calls)
